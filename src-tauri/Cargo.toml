[package]
name = "app-for-oneself-desktop"
version = "0.3.0"
description = "AI 造应用桌面端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_for_oneself_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
