name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, 'ai/**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 检查能跑（不发邮件）
        run: |
          python -c "from src.job import do_job; print(do_job())"
      - run: pytest -q
