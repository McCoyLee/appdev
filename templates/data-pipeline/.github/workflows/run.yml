name: 跑流水线
# 每天 UTC 22:00（北京 06:00）跑一次，结果 commit 回 data/
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 跑流水线
        run: python -m src.pipeline
      - name: 把结果提交回仓库
        run: |
          git config user.name "pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: 同时存一份 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: data/
